services:
  db:
    image: pgvector/pgvector:pg16
    container_name: polarsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: polarsphere
      POSTGRES_PASSWORD: polarsphere
      POSTGRES_DB: polarsphere
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polarsphere -d polarsphere"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
